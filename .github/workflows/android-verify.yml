name: Android Verify

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android_verify:
    name: android_verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      PHASE0_METRICS_DIR: ${{ github.workspace }}/phase0-metrics

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "GitHub source mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA" >&2
            exit 3
          fi
          mkdir -p "$PHASE0_METRICS_DIR"
          printf '%s\n' "$ACTUAL_SHA" | tee github-source-sha.txt "$PHASE0_METRICS_DIR/github-source-sha.txt"
          printf '%s\n' "${{ github.repository }}" > "$PHASE0_METRICS_DIR/github-source-repository.txt"
          printf '%s\n' "${{ github.ref }}" > "$PHASE0_METRICS_DIR/github-source-ref.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 4
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Show Gradle version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build, lint and test
        run: ./gradlew --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease

      - name: Record release dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$PHASE0_METRICS_DIR/release-runtime-classpath.txt"

      - name: Record artifact metrics
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab; do
            printf '%s\t%s bytes\n' "$artifact" "$(stat -c %s "$artifact")"
          done | tee "$PHASE0_METRICS_DIR/artifact-sizes.txt"

          sha256sum \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            | tee "$PHASE0_METRICS_DIR/artifact-sha256.txt"

      - name: Record permission inventory
        shell: bash
        run: |
          set -euo pipefail
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APKANALYZER" ]; then
            echo "apkanalyzer not found at $APKANALYZER" >&2
            exit 5
          fi
          "$APKANALYZER" manifest permissions app/build/outputs/apk/release/app-release-unsigned.apk \
            | tee "$PHASE0_METRICS_DIR/permissions.txt"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verify-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            github-source-sha.txt
            app/build/reports/
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            phase0-metrics/
