stages:
  - verify

image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_COMMAND_LINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
  ANDROID_COMMAND_LINE_TOOLS_SHA256: "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"

cache:
  key: "struna-android-v1"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .android-sdk/cmdline-tools/
    - .android-sdk/platforms/android-36/
    - .android-sdk/build-tools/36.0.0/

android_verify:
  stage: verify
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl unzip
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        curl --fail --location --silent --show-error \
          "$ANDROID_COMMAND_LINE_TOOLS_URL" \
          --output /tmp/android-command-line-tools.zip
        echo "$ANDROID_COMMAND_LINE_TOOLS_SHA256  /tmp/android-command-line-tools.zip" | sha256sum --check -
        rm -rf "$ANDROID_HOME/cmdline-tools/latest" /tmp/cmdline-tools
        unzip -q /tmp/android-command-line-tools.zip -d /tmp
        mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
    - "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
    - chmod +x ./gradlew
    - ./gradlew --version
  script:
    - ./gradlew --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease
    - mkdir -p phase0-metrics
    - |
      for artifact in app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
        printf '%s\t%s bytes\n' "$artifact" "$(stat -c %s "$artifact")"
      done | tee phase0-metrics/artifact-sizes.txt
    - "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions app/build/outputs/apk/release/app-release-unsigned.apk | tee phase0-metrics/permissions.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/reports/
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - phase0-metrics/
